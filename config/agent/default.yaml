_target_: agent.AgentConfig

denoiser:
  _target_: models.diffusion.DenoiserConfig
  sigma_data: 0.5
  sigma_offset_noise: 0.3
  # Optional auxiliary pixel MAE; zero weight preserves the baseline diffusion loss.
  pixel_mask_gain: 0.0
  pixel_mae_weight: 0.0
  # 0 (with pixel_mae_weight > 0) trains on the vehicle-weighted pixel MAE alone.
  diffusion_mse_weight: 1.0
  # > 0 trains a TTC head on the bottleneck jointly with the denoiser (see denoiser.py).
  ttc_loss_weight: 0.0
  ttc_hidden_dim: 256
  ttc_dropout: 0.2
  inner_model:
    _target_: models.diffusion.InnerModelConfig
    img_channels: 3
    num_steps_conditioning: 4
    cond_channels: 256
    depths: [2,2,2,2]
    channels: [64,64,64,64]
    attn_depths: [0,0,0,0]
    # > 0 adds a KineMamba-style dense bottleneck (flatten -> d -> flatten, residual); 1024 adds 31.5M parameters.
    dense_bottleneck_dim: 0
    img_size: ${env.train.size}

rew_end_model:
  _target_: models.rew_end_model.RewEndModelConfig
  lstm_dim: 512
  img_channels: ${agent.denoiser.inner_model.img_channels}
  img_size: ${env.train.size}
  cond_channels: 128
  depths: [2,2,2,2]
  channels: [32,32,32,32]
  attn_depths: [0,0,0,0]

actor_critic:
  _target_: models.actor_critic.ActorCriticConfig
  lstm_dim: 512
  img_channels: ${agent.denoiser.inner_model.img_channels}
  img_size: ${env.train.size}
  channels: [32,32,64,64]
  down: [1,1,1,1]

