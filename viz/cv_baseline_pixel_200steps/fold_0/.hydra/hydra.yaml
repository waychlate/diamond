hydra:
  run:
    dir: /blue/iruchkin/khek.do/diamond_pixel_results/cv_baseline_pixel_200steps/fold_0
  sweep:
    dir: multirun/${now:%Y-%m-%d}/${now:%H-%M-%S}
    subdir: ${hydra.job.num}
  launcher:
    _target_: hydra._internal.core_plugins.basic_launcher.BasicLauncher
  sweeper:
    _target_: hydra._internal.core_plugins.basic_sweeper.BasicSweeper
    max_batch_size: null
    params: null
  help:
    app_name: ${hydra.job.name}
    header: '${hydra.help.app_name} is powered by Hydra.

      '
    footer: 'Powered by Hydra (https://hydra.cc)

      Use --hydra-help to view Hydra specific help

      '
    template: '${hydra.help.header}

      == Configuration groups ==

      Compose your configuration from those groups (group=option)


      $APP_CONFIG_GROUPS


      == Config ==

      Override anything in the config (foo.bar=value)


      $CONFIG


      ${hydra.help.footer}

      '
  hydra_help:
    template: 'Hydra (${hydra.runtime.version})

      See https://hydra.cc for more info.


      == Flags ==

      $FLAGS_HELP


      == Configuration groups ==

      Compose your configuration from those groups (For example, append hydra/job_logging=disabled
      to command line)


      $HYDRA_CONFIG_GROUPS


      Use ''--cfg hydra'' to Show the Hydra config.

      '
    hydra_help: ???
  hydra_logging:
    version: 1
    formatters:
      simple:
        format: '[%(asctime)s][HYDRA] %(message)s'
    handlers:
      console:
        class: logging.StreamHandler
        formatter: simple
        stream: ext://sys.stdout
    root:
      level: INFO
      handlers:
      - console
    loggers:
      logging_example:
        level: DEBUG
    disable_existing_loggers: false
  job_logging:
    version: 1
    formatters:
      simple:
        format: '[%(asctime)s][%(name)s][%(levelname)s] - %(message)s'
    handlers:
      console:
        class: logging.StreamHandler
        formatter: simple
        stream: ext://sys.stdout
      file:
        class: logging.FileHandler
        formatter: simple
        filename: ${hydra.runtime.output_dir}/${hydra.job.name}.log
    root:
      level: INFO
      handlers:
      - console
      - file
    disable_existing_loggers: false
  env: {}
  mode: RUN
  searchpath: []
  callbacks: {}
  output_subdir: .hydra
  overrides:
    hydra:
    - hydra.run.dir=/blue/iruchkin/khek.do/diamond_pixel_results/cv_baseline_pixel_200steps/fold_0
    - hydra.mode=RUN
    task:
    - static_dataset.path=/blue/iruchkin/khek.do/diamond_dataset_1000_200steps/folds/fold_0
    - initialization.path_to_ckpt=null
    - agent.denoiser.sigma_data=0.15
    - agent.denoiser.pixel_mask_gain=0.0
    - agent.denoiser.pixel_mae_weight=0.0
    - common.seed=0
    - common.devices=all
    - wandb.mode=disabled
    - training.num_final_epochs=50
    - training.num_workers_data_loaders=8
    - training.cache_in_ram=False
    - training.compile_wm=False
  job:
    name: main
    chdir: true
    override_dirname: agent.denoiser.pixel_mae_weight=0.0,agent.denoiser.pixel_mask_gain=0.0,agent.denoiser.sigma_data=0.15,common.devices=all,common.seed=0,initialization.path_to_ckpt=null,static_dataset.path=/blue/iruchkin/khek.do/diamond_dataset_1000_200steps/folds/fold_0,training.cache_in_ram=False,training.compile_wm=False,training.num_final_epochs=50,training.num_workers_data_loaders=8,wandb.mode=disabled
    id: ???
    num: ???
    config_name: trainer
    env_set: {}
    env_copy: []
    config:
      override_dirname:
        kv_sep: '='
        item_sep: ','
        exclude_keys: []
  runtime:
    version: 1.3.0
    version_base: '1.3'
    cwd: /home/khek.do/diamond-pixel-cv
    config_sources:
    - path: hydra.conf
      schema: pkg
      provider: hydra
    - path: /home/khek.do/diamond-pixel-cv/config
      schema: file
      provider: main
    - path: ''
      schema: structured
      provider: schema
    output_dir: /blue/iruchkin/khek.do/diamond_pixel_results/cv_baseline_pixel_200steps/fold_0
    choices:
      agent: default
      env: highway
      hydra/env: default
      hydra/callbacks: null
      hydra/job_logging: default
      hydra/hydra_logging: default
      hydra/hydra_help: default
      hydra/help: default
      hydra/sweeper: basic
      hydra/launcher: basic
      hydra/output: default
  verbose: false
